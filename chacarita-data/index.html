<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chacarita-data</title>
<meta name="description" content="Todos los partidos, goles, rachas y récords de Chacarita Juniors desde 1931.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/img/escudo-512.png" type="image/png">
<link rel="preload" href="assets/fonts/Archivo-wdth-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<a class="skip" href="#app">Ir al contenido</a>

<header class="top" id="top">
  <div class="top__in">
    <a class="brand" href="#/" aria-label="chacarita-data, inicio">
      <img src="assets/img/escudo-256.png" alt="" width="30" height="33">
      <span class="brand__word">chacarita<b>-data</b></span>
    </a>
    <nav class="nav" id="nav" aria-label="Secciones">
      <a href="#/rivales" data-nav="rivales">Rivales</a>
      <a href="#/partidos" data-nav="partidos">Partidos</a>
      <a href="#/jugadores" data-nav="jugadores">Jugadores</a>
      <a href="#/temporadas" data-nav="temporadas">Temporadas</a>
      <a href="#/records" data-nav="records">Récords</a>
      <a href="#/efemerides" data-nav="efemerides">Efemérides</a>
      <span class="nav__ink" aria-hidden="true"></span>
    </nav>
    <button class="searchbtn" id="searchbtn" type="button" aria-label="Buscar rival, jugador o temporada">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="searchbtn__t">Buscar</span><kbd>Ctrl K</kbd>
    </button>
    <button class="menubtn" id="menubtn" type="button" aria-label="Menú" aria-expanded="false">
      <span></span><span></span>
    </button>
  </div>
  <div class="stripes" aria-hidden="true"></div>
</header>

<main id="app" tabindex="-1" aria-live="polite"></main>

<footer class="foot" id="foot"></footer>

<dialog class="finder" id="finder" aria-label="Buscar">
  <form method="dialog" class="finder__form">
    <label class="finder__label" for="finderq">Rival, jugador, año o torneo</label>
    <div class="finder__field">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="finderq" type="search" autocomplete="off" spellcheck="false" placeholder="Boca, Coll, 1969…">
      <button class="finder__close" value="cancel" aria-label="Cerrar">Esc</button>
    </div>
  </form>
  <ul class="finder__list" id="finderlist" role="listbox"></ul>
</dialog>

<div class="tip" id="tip" role="tooltip" hidden></div>

<noscript><p style="padding:2rem">chacarita-data necesita JavaScript para mostrar las tablas y los gráficos.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
